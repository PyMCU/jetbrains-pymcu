# Plugin coordinates
pluginVersion = 0.1.0
# Build 243 = 2024.3, the first release the plugin is verified against.
pluginSinceBuild = 243
# The PyCharm Community build the plugin compiles against.
platformVersion = 2024.3.6

# The IntelliJ Platform Gradle Plugin v2 requires JDK 21 for the Gradle daemon.
org.gradle.java.home = /opt/homebrew/opt/openjdk@21
org.gradle.jvmargs = -Xmx4096m -Dfile.encoding=UTF-8

org.gradle.caching = true
org.gradle.configuration-cache = false
org.gradle.parallel = true

# The platform supplies kotlin-stdlib; bundling a second copy breaks class loading.
kotlin.stdlib.default.dependency = false
