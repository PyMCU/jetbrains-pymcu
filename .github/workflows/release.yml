name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the runner's JDK
        run: sed -i '/^org.gradle.java.home/d' gradle.properties

      - name: Take the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pluginVersion = .*/pluginVersion = ${version}/" gradle.properties

      # Never publish something the verifier rejects.
      - run: ./gradlew verifyPlugin --no-daemon

      - name: Sign and publish to the JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Attach the signed distribution to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
