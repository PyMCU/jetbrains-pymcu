# Plugin coordinates
# -beta.1 matches the compiler's 0.1.0b1 and routes publishPlugin to the
# "beta" channel (see the publishing block below).
pluginVersion = 0.1.0-beta.1
# Build 243 = 2024.3, the first release the plugin is verified against.
pluginSinceBuild = 243
# The PyCharm Community build the plugin compiles against.
platformVersion = 2024.3.6

# The IntelliJ Platform Gradle Plugin v2 requires JDK 21 for the Gradle daemon.
# Gradle reads org.gradle.java.home before any build script runs, so a
# per-machine override can't live in a file merged by this project's own
# scripts. Set JAVA_HOME, or add org.gradle.java.home to your user-level
# ~/.gradle/gradle.properties (outside this repo, never committed here).
org.gradle.jvmargs = -Xmx4096m -Dfile.encoding=UTF-8

org.gradle.caching = true
org.gradle.configuration-cache = false
org.gradle.parallel = true

# The platform supplies kotlin-stdlib; bundling a second copy breaks class loading.
kotlin.stdlib.default.dependency = false
