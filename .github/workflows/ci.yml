name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins the daemon JDK to a local Homebrew path; on CI the
      # JDK that setup-java installed is the right one.
      - name: Use the runner's JDK
        run: sed -i '/^org.gradle.java.home/d' gradle.properties

      - run: ./gradlew test verifyPluginProjectConfiguration --no-daemon

      - run: ./gradlew buildPlugin --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the runner's JDK
        run: sed -i '/^org.gradle.java.home/d' gradle.properties

      # Downloads the IDEs it checks against, so it gets its own cache entry.
      - name: Cache plugin verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ hashFiles('gradle.properties') }}

      - run: ./gradlew verifyPlugin --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
